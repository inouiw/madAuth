# Publishes a release when a version tag (v1.2.3, or v1.2.3-beta.1 for a prerelease) is pushed:
# @madauth/web and @madauth/server to npm, the server image to GHCR, and the server bundles to a GitHub release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Check the tag matches the package versions
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for pkg in packages/web packages/server; do
            actual=$(node -p "require('./$pkg/package.json').version")
            if [ "$actual" != "$version" ]; then
              echo "::error::$pkg is at version $actual, but the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  npm:
    needs: check
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # Trusted publishing: npm exchanges the workflow's OIDC token for a short-lived publish token.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Trusted publishing needs npm 11.5.1 or newer.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/server -w packages/web
      # Skips a package whose version is already on npm, e.g. the hand-published first version or a re-run.
      - name: Publish to npm
        env:
          VERSION: ${{ needs.check.outputs.version }}
          DIST_TAG: ${{ needs.check.outputs.prerelease == 'true' && 'next' || 'latest' }}
        run: |
          for pkg in packages/server packages/web; do
            name=$(node -p "require('./$pkg/package.json').name")
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already published, skipping"
            else
              npm publish -w "$pkg" --tag "$DIST_TAG"
            fi
          done

  docker:
    # After npm, so the image isn't pushed for a release that npm rejected or that is still waiting for approval.
    needs: [check, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/madauth-server
          # semver patterns don't tag prereleases with major/minor/latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    needs: [check, npm, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w packages/server
      - name: Create the GitHub release with the server bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd packages/server/dist/standalone
          cp main.mjs madauth-server-node.mjs
          cp lambda.mjs madauth-server-lambda.mjs
          cp azure.mjs madauth-server-azure.mjs
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            ${{ needs.check.outputs.prerelease == 'true' && '--prerelease' || '' }} \
            madauth-server-node.mjs madauth-server-lambda.mjs madauth-server-azure.mjs
