services:
  madauth:
    build:
      context: ../..
      dockerfile: packages/server/Dockerfile
    env_file: .env
    environment:
      # E-mail & password users are stored in this SQLite file, on the volume below.
      DATABASE_URL: sqlite:/data/madauth.db
      # The webhook receiver must be reachable from the container. A receiver on your machine (e.g. the dev-receiver):
      # WEBHOOK_URL: http://host.docker.internal:8790/webhook
    ports:
      - '8787:8787'
    volumes:
      - madauth-data:/data
    # Hardening, see "Hardening" in docs/server.md: whoever can read the server's memory or plant a file can read
    # its keys and every record.
    # A read-only file system. The volume above stays writable, for the database and its WAL files.
    read_only: true
    tmpfs:
      - /tmp # temporary files, in memory
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      core: 0 # no core dumps (soft and hard limit)

volumes:
  madauth-data:
