AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: madAuth webhook receiver that sends madAuth's e-mails with Amazon SES.

Parameters:
  WebhookSecret:
    Type: String
    NoEcho: true
    Description: The same WEBHOOK_SECRET as the madAuth server (npx @madauth/server generate-webhook-secret).
  MailFrom:
    Type: String
    Description: Sender, e.g. "Example" <no-reply@example.com>. Its domain must be verified in SES.
  SendingDomain:
    Type: String
    Description: The SES identity the e-mails are sent from, e.g. example.com.
  ConfigurationSet:
    Type: String
    Default: ''
    Description: Optional SES configuration set, e.g. to record bounces and complaints.

Conditions:
  HasConfigurationSet: !Not [!Equals [!Ref ConfigurationSet, '']]

Resources:
  MailerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handler.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 256
      # madAuth waits up to 10 seconds for an answer.
      Timeout: 8
      Environment:
        Variables:
          WEBHOOK_SECRET: !Ref WebhookSecret
          MAIL_FROM: !Ref MailFrom
          SES_CONFIGURATION_SET: !Ref ConfigurationSet
      # Public URL without AWS authentication: every call is checked against WEBHOOK_SECRET instead.
      FunctionUrlConfig:
        AuthType: NONE
      Policies:
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource:
                - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${SendingDomain}
                - !If
                  - HasConfigurationSet
                  - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:configuration-set/${ConfigurationSet}
                  - !Ref AWS::NoValue
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints: [src/handler.ts]
        Format: esm
        OutExtension: ['.js=.mjs']
        Target: es2022
        # The AWS SDK is part of the Lambda runtime.
        External: ['@aws-sdk/*']
        Banner: ['js=import { createRequire } from "module"; const require = createRequire(import.meta.url);']

Outputs:
  WebhookUrl:
    Description: Set this as WEBHOOK_URL on the madAuth server.
    Value: !GetAtt MailerFunctionUrl.FunctionUrl
